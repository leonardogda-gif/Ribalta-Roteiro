<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ribalta Roteiros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: estúdio em etapas. Topo com as etapas da peça (no celular, barra inferior); cada etapa tem sua mesa: trilha da história, quadro de cenas, folha do roteiro, sala de ensaio, painel de produção e documentos. */
:root{
  --bg:#F6F4F7; --surface:#FFFFFF; --canvas:#ECE8EF; --page:#FFFFFF; --page-ink:#141414;
  --ink:#1E1A2B; --muted:#625C73; --line:#DDD7E3;
  --brand:#8A1E43; --brand-ink:#FFFFFF; --brand-soft:#F6E4EA;
  --spot:#F2B33D; --spot-soft:#FDF1D6; --spot-ink:#6B4700;
  --sel:#F3EEF6; --ok:#1C7C4A; --ok-soft:#E1F3E8; --warn:#B45309; --warn-soft:#FDEBD3; --danger:#B4232C;
  --shadow:0 1px 2px rgba(40,20,40,.07),0 8px 26px rgba(40,20,40,.09);
  --curtain:#5A1530; --curtain-2:#3B0C1F; --curtain-ink:#FFF4F7;
  --f-ui:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-script:"Courier Prime", "Courier New", Courier, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15121C; --surface:#1E1A27; --canvas:#0F0D14; --page:#1D1926; --page-ink:#ECE8F2;
  --ink:#EEEAF4; --muted:#A79FB7; --line:#332D40;
  --brand:#F08AAA; --brand-ink:#1A0F15; --brand-soft:#3A1C28;
  --spot:#F2B33D; --spot-soft:#2F2614; --spot-ink:#F5CB72;
  --sel:#2A2436; --ok:#5BC28A; --ok-soft:#173022; --warn:#F2A65A; --warn-soft:#33240F; --danger:#F07A80;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.35); --curtain:#4A1A2C; --curtain-2:#2A0F1A; --curtain-ink:#FFF4F7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15121C; --surface:#1E1A27; --canvas:#0F0D14; --page:#1D1926; --page-ink:#ECE8F2;
  --ink:#EEEAF4; --muted:#A79FB7; --line:#332D40;
  --brand:#F08AAA; --brand-ink:#1A0F15; --brand-soft:#3A1C28;
  --spot:#F2B33D; --spot-soft:#2F2614; --spot-ink:#F5CB72;
  --sel:#2A2436; --ok:#5BC28A; --ok-soft:#173022; --warn:#F2A65A; --warn-soft:#33240F; --danger:#F07A80;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.35); --curtain:#4A1A2C; --curtain-2:#2A0F1A; --curtain-ink:#FFF4F7; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--spot);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:700;min-height:44px;font-size:15px;white-space:nowrap;transition:transform .12s, background .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.spot{background:var(--spot);color:#2A1D00;border-color:var(--spot)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px;border-radius:10px}
.btn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.icon{width:42px;padding:0}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{font-size:14px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--canvas);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill.spot{background:var(--spot-soft);color:var(--spot-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- topo ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:6px;padding:8px 16px;min-height:58px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:18px;background:none;border:0;padding:0;flex:none}
.doc-title{flex:1;min-width:0;display:grid;line-height:1.2}
.doc-title b{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-title small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex:none}
.saved i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.saved.busy i{background:var(--spot)}
.stages{display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none;max-width:1280px;margin:0 auto}
.stages::-webkit-scrollbar{display:none}
.stages button{flex:none;display:flex;align-items:center;gap:7px;border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;font-size:15px}
.stages button.on{color:var(--brand);border-bottom-color:var(--brand)}
.stages button .k{font-size:11px;font-family:var(--f-script);opacity:.7}
.bnav{display:none}
.hide-sm{display:inline-flex}
.only-sm{display:none}
@media (max-width:760px){
  .hide-sm{display:none!important}.only-sm{display:inline-flex}.saved span{display:none}
  .stages{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .bnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:700;color:var(--muted);border-radius:10px;min-height:52px}
  .bnav button.on{color:var(--brand);background:var(--brand-soft)}
  body.typing .bnav{display:none}
}

/* ---------- área de trabalho ---------- */
.work{max-width:1280px;margin:0 auto;padding:20px 16px 150px;display:grid;gap:18px;align-content:start}
.work.split{grid-template-columns:1fr}

.col{min-width:0;display:grid;gap:16px;align-content:start}
.panel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:grid;gap:16px;min-width:0}
@media (max-width:640px){.panel{padding:16px;border-radius:14px}}
.panel-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap}
.panel-head h2{font-size:clamp(22px,4.5vw,28px);font-weight:800}
.panel-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.sec-title{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sec-title h3{font-size:19px}
label.f{display:grid;gap:5px;font-weight:700;font-size:14px;min-width:0}
label.f .h{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],textarea.in,select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
textarea.in{resize:vertical;min-height:76px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{border:1.5px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;background:var(--surface);min-width:0}
.swatch{width:28px;height:28px;border-radius:50%;border:0;padding:0}
.swatch.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.divider{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.empty{color:var(--muted);text-align:center;padding:18px;border:1.5px dashed var(--line);border-radius:14px;font-size:15px;display:grid;gap:10px;justify-items:center}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.tbl tr:last-child td{border-bottom:0}
.tbl input{min-height:36px;padding:6px 9px;background:var(--surface);min-width:140px}
.tbl textarea.in{min-height:40px;padding:6px 9px;background:var(--surface);min-width:180px}

/* ---------- duração ---------- */
.dur{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-radius:14px;padding:12px 14px;background:var(--canvas)}
.dur .big{font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.dur .meter{flex:1 1 160px;height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden;min-width:100px}
.dur .meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ok)}
.dur.over .meter i{background:var(--warn)}
.dur .msg{font-size:14px;color:var(--muted);flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.side .dur{padding:10px;gap:8px}.side .dur .big{font-size:19px}

/* ---------- etapas (cartões de projeto) ---------- */
.stagebar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.stagebar div{display:grid;gap:4px;font-size:11px;font-weight:700;color:var(--muted);text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stagebar i{height:6px;border-radius:3px;background:var(--line)}
.stagebar .done i{background:var(--ok)}
.stagebar .part i{background:var(--spot)}
.tag2{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--spot-soft);color:var(--spot-ink);margin-left:6px;vertical-align:middle}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* ---------- guia ---------- */
.guide{background:var(--spot-soft);border:1.5px solid var(--spot);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.guide-top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.guide b{font-family:var(--f-display);font-size:19px}
.guide textarea{background:var(--surface)}
.gdots{display:flex;gap:4px}
.gdots i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.gdots i.d{background:var(--ok)}
.gdots i.c{background:var(--spot)}

/* ---------- história ---------- */
.trail{display:grid;gap:0;position:relative}
.stop{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.stop:not(:last-child)::before{content:"";position:absolute;left:21px;top:46px;bottom:4px;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 11px)}
.stop .n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--brand-soft);color:var(--brand);font-size:15px}
.stop.d .n{background:var(--brand);color:var(--brand-ink)}
.stop label.f{font-size:15px}
.story-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.qcard{border-radius:14px;padding:14px;background:var(--bg);display:grid;gap:6px;align-content:start}
.qcard b{font-family:var(--f-display);font-size:16px}
.qcard textarea{background:var(--surface);min-height:60px}

/* ---------- quadro de cenas ---------- */
.board-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.act{display:grid;gap:10px}
.act-h{display:flex;align-items:center;gap:10px}
.act-h b{font-family:var(--f-display);font-size:18px;letter-spacing:.04em;color:var(--brand)}
.act-h::after{content:"";flex:1;height:2px;background:var(--line)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.scard{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:grid;grid-template-rows:auto 1fr auto auto;min-width:0;position:relative;transition:box-shadow .15s,transform .15s;border-top:5px solid var(--brand)}
.scard:hover{transform:translateY(-1px)}
.scard .sc-top{display:flex;align-items:center;gap:6px;padding:10px 8px 0 14px}
.scard .num{font-family:var(--f-script);font-weight:700;font-size:13px;color:var(--muted)}
.grip{border:0;background:none;color:var(--muted);width:40px;height:40px;border-radius:9px;display:grid;place-items:center;touch-action:none;cursor:grab;margin-left:auto}
.grip:hover{background:var(--bg)}
.grip:active{cursor:grabbing}
.scard .sc-body{padding:6px 14px 10px;display:grid;gap:6px;text-align:left;border:0;background:none;width:100%;align-content:start}
.scard h4{font-family:var(--f-display);font-size:18px;margin:0;line-height:1.2;overflow-wrap:anywhere}
.scard .loc{font-size:13px;color:var(--muted);font-style:italic}
.scard .res{font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.scard .res.ph{color:var(--muted)}
.scard .sc-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line)}
.scard .who{font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center;min-width:0}
.scard .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard.dragging{opacity:.35}
.scard.drop-b{box-shadow:-6px 0 0 var(--spot),var(--shadow)}
.scard.drop-a{box-shadow:6px 0 0 var(--spot),var(--shadow)}
@media (max-width:640px){.scard.drop-b{box-shadow:0 -6px 0 var(--spot),var(--shadow)}.scard.drop-a{box-shadow:0 6px 0 var(--spot),var(--shadow)}.board{grid-template-columns:minmax(0,1fr)}}
.add-card{border:2px dashed var(--line);border-radius:14px;background:transparent;display:grid;place-items:center;gap:6px;min-height:150px;font-weight:700;color:var(--muted)}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;opacity:.92;transform:rotate(-2deg);margin:0}

/* ---------- roteiro ---------- */
.side{display:none;align-self:start;position:sticky;top:130px;max-height:calc(100vh - 150px);overflow:auto;gap:18px}
@media (min-width:1000px){.split .side{display:grid}}
.side-sec{display:grid;gap:4px}
.nav-item{display:flex;gap:8px;align-items:baseline;text-align:left;border:0;background:none;padding:7px 8px;border-radius:9px;width:100%}
.nav-item:hover{background:var(--surface)}
.nav-item.on{background:var(--surface);box-shadow:var(--shadow)}
.nav-item b{font-family:var(--f-script);font-size:13px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.nav-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700}
.nav-item small{margin-left:auto;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.nav-act{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--brand);padding:6px 8px 0}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:2px 8px;gap:8px}
.stat b{font-variant-numeric:tabular-nums}
.typebar{display:flex;gap:3px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--shadow);max-width:100%}
.typebar::-webkit-scrollbar{display:none}
.typebar button{flex:none;border:0;background:none;border-radius:9px;padding:7px 10px;font-weight:700;font-size:14px;color:var(--muted);min-height:38px}
.typebar button.on{background:var(--brand);color:var(--brand-ink)}
.typebar .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px;flex:none}
.typebar .ai-btn{color:var(--spot-ink);display:flex;gap:6px;align-items:center}
.bar-wrap{position:sticky;top:124px;z-index:10;display:grid;gap:6px;justify-items:center;min-width:0}
.hint{font-size:12px;color:var(--muted);text-align:center;max-width:640px}
.sugs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sugs button{border:1.5px solid var(--line);background:var(--page);border-radius:999px;padding:5px 11px;font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;font-family:var(--f-script);text-transform:uppercase;min-height:36px}
@media (max-width:999px){
  .bar-wrap{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));top:auto;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px;justify-items:stretch;z-index:22}
  .typebar{box-shadow:none;border:0;padding:0;background:none}
  .sugs{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .sugs button{flex:none}
  .hint{display:none}
}
@media (min-width:761px) and (max-width:999px){.bar-wrap{bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}}
@media (max-width:760px){body.typing .bar-wrap{bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}}
.page{background:var(--page);color:var(--page-ink);box-shadow:var(--shadow);border-radius:4px;width:100%;max-width:820px;margin:0 auto;padding:64px 72px 80px;min-height:60vh;font-family:var(--f-script);font-size:16px;line-height:1.35}
@media (max-width:640px){.page{padding:26px 14px 48px;font-size:15px}}
.page-wrap{background:var(--canvas);border-radius:16px;padding:22px 12px;min-width:0}
@media (max-width:640px){.page-wrap{padding:0;background:none}}
.el{position:relative;display:flex;align-items:flex-start;border-left:4px solid transparent;border-radius:2px}
.el textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;overflow:hidden;padding:2px 6px;border-radius:6px;font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;text-transform:inherit;text-decoration:inherit;min-height:0;display:block}
.el .tx{flex:1;min-width:0;padding:2px 6px;white-space:pre-wrap}
.el-personagem .tx,.el-parentese .tx{text-align:center}.el-transicao .tx{text-align:right}
.el textarea:focus{outline:none;background:var(--sel)}
.el textarea::placeholder{color:var(--muted);opacity:.7;text-transform:none;font-style:normal;text-decoration:none}
.el .tag{position:absolute;left:-70px;top:4px;font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:0;width:62px;text-align:right}
.el:focus-within .tag{opacity:1}
@media (max-width:640px){.el .tag{display:none}}
.el-cena{margin-top:1.8em;font-weight:700;text-transform:uppercase}
.el-cena:first-child,.act-div+.el-cena,.focus-nav+.el-cena{margin-top:0}
.el-cena .sn{flex:none;padding:2px 0 2px 6px;text-decoration:underline}
.el-cena textarea{text-decoration:underline}
.scene-loc{font-family:var(--f-ui);font-size:13px;color:var(--muted);padding:0 10px 4px;font-style:italic}
.act-div{font-family:var(--f-ui);display:flex;align-items:center;gap:10px;margin:2.2em 0 1.2em;color:var(--brand);font-weight:800;letter-spacing:.12em;font-size:13px}
.act-div:first-child{margin-top:0}
.act-div::before,.act-div::after{content:"";flex:1;height:1px;background:var(--line)}
.el-acao{margin:.7em 0 .7em 26%;font-style:italic}
.el-musica{margin:.7em 0 .7em 26%;font-style:italic}
.el-musica .pre{flex:none;padding:2px 0 2px 6px;font-weight:700;font-style:normal}
.el-personagem{margin-top:1em;text-transform:uppercase}
.el-personagem textarea{text-align:center}
.el-parentese{margin:0 22%;font-style:italic;justify-content:center}

.pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok);border-radius:4px}

/* ---------- iluminação ---------- */

.cue .code{font-family:var(--f-script);font-weight:700;font-size:15px}
.cue .t{min-width:0;display:grid;border:0;background:none;text-align:left;padding:2px 0;gap:1px}
.cue .t b{overflow-wrap:anywhere;font-size:15px}
.cue .t small{color:var(--muted);overflow-wrap:anywhere}
.cue-row{display:flex;gap:0;align-items:center}
.cue-row .star{width:34px;height:34px}
.lrowf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);text-align:left;width:100%}
.lrowf b{overflow-wrap:anywhere}.lrowf small{color:var(--muted);display:block;overflow-wrap:anywhere}
.swc{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid var(--line);flex:none}
.stage-map{width:100%;height:auto;max-width:720px;display:block;margin:0 auto;background:var(--bg);border-radius:12px}
.stage-map .sm-stage{fill:var(--canvas);stroke:var(--muted);stroke-width:.4}
.stage-map .sm-area{fill:rgba(242,179,61,.14);stroke:var(--spot);stroke-width:.35;stroke-dasharray:1.2 .8;cursor:pointer}
.stage-map .sm-area.on{fill:rgba(242,179,61,.38)}
.stage-map .sm-lab{fill:var(--muted);font-size:2.6px;font-weight:700;letter-spacing:.3px;text-anchor:middle;font-family:var(--f-ui)}
.stage-map .sm-an{fill:var(--ink);font-size:2.5px;text-anchor:middle;font-family:var(--f-ui);pointer-events:none}
.stage-map .sm-fx{stroke:var(--ink);stroke-width:.4;cursor:pointer}
.stage-map .sm-fx.on{stroke:var(--brand);stroke-width:1}
.stage-map .sm-fl{fill:var(--ink);font-size:2.4px;text-anchor:middle;font-family:var(--f-ui);font-weight:700;pointer-events:none}
.stage-map .sm-edge{stroke:var(--muted);stroke-width:.3;stroke-dasharray:1 1}
.lq{font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--spot-ink);background:var(--spot-soft);border-radius:999px;padding:3px 10px;margin:8px 0 2px 26%;display:inline-flex;gap:6px;align-items:center;border:0;cursor:pointer;text-transform:none;font-style:normal}
@media (max-width:640px){.lq{margin-left:4%}}
.r-cue{font-family:var(--f-ui);font-size:13px;font-weight:700;color:#6B4700;background:#FDF1D6;border-radius:8px;padding:3px 10px;margin:.8em 0 .2em;display:inline-flex;gap:6px;align-items:center}
.techsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.techsum div{background:var(--bg);border-radius:10px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.techsum span{font-size:12px;color:var(--muted)}
.techsum b{font-size:14px;overflow-wrap:anywhere}
.lnk{border:0;background:var(--spot-soft);color:var(--spot-ink);font-weight:700;border-radius:6px;padding:2px 6px;font-family:var(--f-script);font-size:13px}
.mtec td{white-space:normal;min-width:70px}
.mtec tr.first td{border-top:2px solid var(--line)}
@media (max-width:640px){textarea.in{min-height:56px}.prompt{padding:12px}}
/* ---------- simplificação (UX v6) ---------- */
/* IA: presente, mas abaixo da ação principal */
.btn.spot{background:var(--spot-soft);color:var(--spot-ink);border-color:var(--spot)}
.typebar .ai-btn{color:var(--muted)}
/* navegação em três grupos */
.stages .grp{flex:none;align-self:center;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 2px 0 14px;margin-left:6px;border-left:1px solid var(--line);opacity:.85}
.more .grp-h{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 0 -2px}
/* próximo passo: uma recomendação por vez */
.nextstep{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;border-radius:16px;padding:16px 18px;background:var(--brand-soft);border:1.5px solid var(--brand)}
.nextstep b{font-family:var(--f-display);font-size:20px;display:block;overflow-wrap:anywhere}
.nextstep p{margin:4px 0 0;color:var(--muted);font-size:14px}
.nextstep.ok{background:var(--ok-soft);border-color:var(--ok)}
@media (max-width:640px){.nextstep{grid-template-columns:minmax(0,1fr)}.nextstep .btn{justify-self:start}}
/* filtros: seleção ativa sempre visível */
.active-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;background:var(--spot-soft);color:var(--spot-ink);border-radius:10px;padding:6px 6px 6px 12px;font-weight:700}
.active-f .btn{color:var(--ink)}
.sortbox{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-weight:700;flex:none}
.sortbox select{width:auto;min-height:40px;padding:6px 10px;font-weight:400;color:var(--ink)}
/* abas com "Mais opções" */
.tabrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
details.tabmore{position:relative}
details.tabmore summary{list-style:none;cursor:pointer;border:1.5px dashed var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;min-height:40px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
details.tabmore summary::-webkit-details-marker{display:none}
details.tabmore[open] summary{border-style:solid;color:var(--ink)}
details.tabmore .ptabs{flex-wrap:wrap;margin-top:8px}
@media (max-width:640px){.ptabs.main{flex-wrap:nowrap}}
/* cartão de cena: ação principal clara, ações secundárias no menu */
.scard .sc-acts{display:flex;gap:6px;align-items:center;padding:0 12px 12px}
.scard .menu{top:46px}
.scard .confirm{padding:0 12px 12px}
/* estados do ensaio com texto */
.r-item .stl{font-size:12px;font-weight:700}
.r-item.on .t b::before{content:"▸ ";color:var(--brand)}
/* iluminação: perguntas práticas */
.qblock{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.qblock>b{font-size:15px;display:flex;gap:8px;align-items:center}
.qn{width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:inline-grid;place-items:center;font-size:13px;flex:none}
.fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fx-grid button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;font-weight:700;font-size:14px;min-height:48px;display:grid;gap:2px}
.fx-grid button small{font-weight:400;color:var(--muted);font-size:12px}
.fx-grid button.on{border-color:var(--spot);background:var(--spot-soft)}
details.more-d summary small{font-weight:400;color:var(--muted);margin-left:6px}
/* documentos: resumo antes de gerar */
.docsum{border-radius:12px;background:var(--bg);padding:12px 14px;display:grid;gap:4px;font-size:14px}
.docsum b{font-size:15px}
.docsum.warn{background:var(--warn-soft);color:var(--warn)}
.p-item .t small.fn{white-space:normal;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
button.doc-title{border:0;background:none;text-align:left;padding:4px 6px;border-radius:8px;color:inherit}
button.doc-title:hover{background:var(--bg)}
body{margin:0}

function migrate(o){
  if(o.v===3||o.v===2) return ensureDefaults(o);
  const p=blankPlay(); Object.assign(p,{id:o.id,exemplo:o.exemplo,titulo:o.titulo||"",tema:o.tema||"",versiculo:o.versiculo||"",ocasiao:o.ocasiao||"",duracao:o.duracao||"",publico:o.publico||"",sinopse:o.sinopse||"",
    personagens:(o.personagens||[]).map(c=>({id:c.id,nome:c.nome||"",descricao:c.descricao||"",cor:c.cor||COLORS[0],ator:c.ator||"",figurino:c.figurino||""})),
    producao:o.producao||p.producao,ideias:o.ideias||[],tab:"roteiro",updatedAt:o.updatedAt||0});
  const nm=id=>(o.personagens||[]).find(c=>c.id===id)?.nome||"";
  (o.cenas||[]).forEach(c=>{
    p.els.push({id:uid(),t:"cena",x:c.titulo||"",note:c.objetivo||""});
    if(c.cenario) p.els.push({id:uid(),t:"acao",x:c.cenario});
    (c.blocos||[]).forEach(b=>{
      if(b.tipo==="acao") p.els.push({id:uid(),t:"acao",x:b.texto});
      else if(b.tipo==="musica") p.els.push({id:uid(),t:"musica",x:b.texto});
      else{ p.els.push({id:uid(),t:"personagem",x:nm(b.personagemId)||(b.tipo==="narracao"?"Narrador":"")}); if(b.rubrica) p.els.push({id:uid(),t:"parentese",x:b.rubrica}); p.els.push({id:uid(),t:"fala",x:b.texto}); }
    });
  });
  return ensureDefaults(p);
}

  let n=0; p.els.forEach((e,i)=>{ if(e.t==="cena"){ n++; r.push({start:i,end:p.els.length,el:e,n}); } });

}

function speakerOf(p,i){ for(let k=i;k>=0;k--){ const e=p.els[k]; if(e.t==="personagem") return e.x; if(e.t!=="fala"&&e.t!=="parentese") return null; } return null; }

function secondsOf(els){ let s=0; els.forEach(e=>{ const w=words(e.x); if(e.t==="fala") s+=w/130*60+1.5; else if(e.t==="acao") s+=w/200*60+3; else if(e.t==="musica") s+=60; else if(e.t==="transicao") s+=5; }); return Math.round(s); }

  const diff=t-meta;

    <div><span class="eyebrow">Estimativa atual</span><div class="big">${fmtLong(d.t)}</div></div>
    ${d.meta?`<div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div><span class="pill ${d.pill}">${d.pill==="warn"?"⚠ ":d.pill==="ok"?"✓ ":""}${d.short}</span>`:""}
    <span class="msg">${d.cls==="over"?"⚠ ":""}${esc(d.msg)}</span>

function longsHTML(p){

function charTime(p,c){ let inScene=0, speak=0; charScenes(p,c).forEach(o=>{ inScene+=o.inf.secs; }); p.els.forEach((e,i)=>{ if(e.t==="fala"&&norm(speakerOf(p,i))===norm(c.nome)) speak+=words(e.x)/130*60+1.5; }); return {inScene,speak:Math.round(speak)}; }

/* mover, duplicar e apagar mexem em p.els: quadro e roteiro mudam juntos */
function blocksOf(p){ const sc=scenes(p); const pro=sc[0]&&!sc[0].el?p.els.slice(sc[0].start,sc[0].end):[]; const bl=sc.filter(s=>s.el).map(s=>p.els.slice(s.start,s.end)); return {pro,bl}; }

  if(p.lighting) p.lighting.cues.filter(c=>c.sceneId===id).forEach(c=>{ const n=JSON.parse(JSON.stringify(c)); n.id=uid(); n.sceneId=copy[0].id; n.elId=map[c.elId]||""; n.ensaiado=false; p.lighting.cues.push(n); }); copy[0].x=(copy[0].x||"Cena")+" (cópia)"; copy[0].status="nao"; copy[0].notas=[]; p.els.splice(s.end,0,...copy); return copy[0]; }

const TRANS_RE=/^(blackout|black-out|fim|fim da peça|luz apaga|apagam-se as luzes|cortina|fecham-se as cortinas|fade|corta)\.?!?$/i;
function nameLike(x){ return x.length<=30 && words(x)<=4 && !/[.!?…,;:]$/.test(x) && /^[\p{L}][\p{L}\d .'\-]*$/u.test(x); }
function isUpperName(x){ return nameLike(x) && x===x.toLocaleUpperCase("pt-BR") && /\p{Lu}/u.test(x); }
/* Recebe a linha que a pessoa acabou de escrever e devolve as linhas corrigidas */
function smartFix(p,el){
  const x=el.x.trim(); if(!x) return [el];
  let m;
  if(el.t!=="fala" && (m=x.match(/^(?:cena(?:\s+\d+)?|int\.|ext\.)(?:\s*[—\-:.]\s*|\s+|$)(.*)$/i))){ el.t="cena"; el.x=m[1]||""; sceneDefaults(el); return [el]; }
  if((m=x.match(/^(?:♪|música:|musica:|som:)\s*(.*)$/i))){ el.t="musica"; el.x=m[1]; return [el]; }
  if(el.t!=="fala" && TRANS_RE.test(x)){ el.t="transicao"; return [el]; }
  if((m=x.match(/^\(([\s\S]*)\)$/))){ el.x=m[1].trim(); const i=p.els.indexOf(el), prev=p.els[i-1];
    const contFala = el.t==="personagem" && prev && (prev.t==="fala"||prev.t==="parentese") && words(el.x)<=6;
    el.t = (el.t==="fala"||el.t==="parentese"||contFala) ? "parentese" : "acao"; return [el]; }
  if(el.t!=="cena" && (m=x.match(/^([\p{L}][\p{L}\d .'\-]{0,28}):\s+([\s\S]+)$/u)) && (isUpperName(m[1])||charByName(p,m[1]))){
    const c=charByName(p,m[1]); el.t="personagem"; el.x=c?c.nome:m[1].trim();
    const extra=[]; let fala=m[2].trim(); const par=fala.match(/^\(([^)]*)\)\s*([\s\S]*)$/); if(par){ extra.push({id:uid(),t:"parentese",x:par[1].trim()}); fala=par[2]; }
    extra.push({id:uid(),t:"fala",x:fala}); return [el,...extra];
  }
  if(el.t==="personagem"){ const c=charByName(p,x); if(c){ el.x=c.nome; return [el]; } if(!nameLike(x)) el.t="acao"; return [el]; }
  if(el.t==="acao"){ const c=charByName(p,x); if(c||isUpperName(x)){ el.t="personagem"; el.x=c?c.nome:x; } return [el]; }
  return [el];
}

function localIssues(p){
  const out=[], sc=named(p), infos=sc.map(s=>sceneInfo(p,s)), d=durState(p), tot=Math.max(1,d.t);
  const add=o=>out.push({sev:"warn",...o});
  if(d.cls==="over") add({id:"dur",problema:"A peça passou da duração desejada",explic:d.msg,sug:"Veja quais cenas mais pesam no tempo e encurte falas longas ou repetidas.",fix:"longs",fixL:"Ver cenas mais longas"});
  if(sc.length>=3) infos.forEach((inf,i)=>{ if(inf.written&&inf.secs>Math.max(180,tot*.4)) add({id:"long:"+sc[i].el.id,problema:`A cena ${sc[i].n} está muito longa`,explic:`Ela ocupa ${fmt(inf.secs)} de ${fmtLong(tot)} da peça.`,sug:"Divida em duas cenas ou corte falas que repetem a mesma ideia.",scene:sc[i].el.id}); });
  if(sc.length&&!p.dev.climax.trim()) add({id:"climax",problema:"A história ainda não tem um clímax definido",explic:"O clímax é o momento mais forte da peça, quando tudo se decide.",sug:"Escreva em uma frase qual é a grande virada.",fix:"climax",fixL:"Escrever o clímax"});
  if(sc.length&&!p.dev.conflito.trim()&&!p.dev.conflitoArco.trim()) add({id:"conf",problema:"O conflito principal não está definido",explic:"Sem um problema claro, a peça perde força e o público se distrai.",sug:"Diga o que atrapalha o protagonista.",fix:"conflito",fixL:"Definir o conflito"});
  if(sc.length&&words(p.dev.final)<4) add({sev:"info",id:"final",problema:"O final está pouco desenvolvido",explic:"O final é o que o público leva para casa.",sug:"Descreva como termina e o que mudou.",fix:"final",fixL:"Escrever o final"});
  const lc=p.personagens.map(c=>({c,n:lineCount(p,c),cs:charScenes(p,c).length})), totalF=lc.reduce((a,x)=>a+x.n,0);
  if(sc.length) lc.filter(x=>x.cs===0).forEach(x=>add({id:"aus:"+x.c.id,problema:`${x.c.nome} não aparece em nenhuma cena`,explic:"Está na lista de personagens, mas não fala nem foi marcado em cena.",sug:"Dê uma função a ele na história, marque-o em uma cena ou remova da lista.",char:x.c.id}));
  if(totalF>=8) lc.filter(x=>x.cs>0&&x.n===1).forEach(x=>add({sev:"info",id:"pouco:"+x.c.id,problema:`${x.c.nome} aparece pouco`,explic:`Tem ${pl(x.n,"fala","falas")} na peça inteira.`,sug:"Veja se pode ganhar mais presença ou ser juntado a outro personagem.",char:x.c.id}));
  if(lc.length>=3&&totalF>=10){ const top=lc.slice().sort((a,b)=>b.n-a.n)[0]; if(top.n/totalF>.5) add({sev:"info",id:"muito:"+top.c.id,problema:`${top.c.nome} concentra a peça`,explic:`Tem ${Math.round(top.n/totalF*100)}% de todas as falas.`,sug:"Em elenco amador, dividir algumas falas alivia quem precisa decorar.",char:top.c.id}); }
  const semF=p.personagens.filter(c=>!c.descricao.trim()&&!c.objetivo.trim());
  if(semF.length) add({sev:"info",id:"func",problema:semF.length===1?`${semF[0].nome} não tem função clara`:`${semF.length} personagens sem função clara`,explic:`Sem descrição nem objetivo: ${semF.map(c=>c.nome).join(", ")}.`,sug:"Escreva em uma frase quem ele é e o que quer.",char:semF[0].id});
  const semR=sc.filter(s=>!s.el.note.trim()); if(semR.length) add({sev:"info",id:"res",problema:semR.length===1?`A cena ${semR[0].n} não tem resumo`:`${semR.length} cenas sem resumo`,explic:`Cenas: ${semR.map(s=>s.n).join(", ")}. O resumo aparece no quadro e orienta a IA.`,sug:"Escreva uma frase dizendo o que acontece.",scene:semR[0].el.id,fix:"resumo",fixL:"Escrever o resumo"});
  const vaz=sc.filter((s,i)=>!infos[i].written); if(vaz.length) add({sev:"info",id:"vaz",problema:vaz.length===1?`A cena ${vaz[0].n} ainda não tem falas`:`${vaz.length} cenas ainda sem falas`,explic:`Cenas: ${vaz.map(s=>s.n).join(", ")}.`,sug:"Escreva uma de cada vez, começando pela primeira.",scene:vaz[0].el.id,fix:"escrever",fixL:"Escrever agora"});
  const semA=p.personagens.filter(c=>!c.ator.trim()); if(semA.length&&infos.some(i=>i.written)) add({sev:sc.some(s=>s.el.status!=="nao")?"warn":"info",id:"ator",problema:semA.length===1?`${semA[0].nome} ainda não tem ator`:`${semA.length} personagens sem ator`,explic:semA.map(c=>c.nome).join(", ")+".",sug:"Defina o elenco antes dos ensaios.",fix:"elenco",fixL:"Definir elenco"});
  const semFig=p.personagens.filter(c=>!c.figurino.trim()&&charScenes(p,c).length); if(semFig.length&&infos.some(i=>i.written)) add({sev:"info",id:"fig",problema:`${pl(semFig.length,"personagem sem figurino","personagens sem figurino")}`,explic:semFig.map(c=>c.nome).join(", ")+".",sug:"Anote o figurino de cada um, mesmo que seja simples.",fix:"figurino",fixL:"Preencher figurinos"});

  return out;
}

async function analyze(p){

  try{
    const r=await sample.json(prompt,{signal:aiCtl.signal,cache:false,modelTier:"complex"});
    S.an[p.id].ai=(r.pontos||[]).filter(x=>x&&x.problema).map((x,i)=>{ const s=x.cena!=null?sceneByNum(p,x.cena):null; const c=x.personagem?charByName(p,x.personagem):null;
      return {id:"ai"+Date.now()+i,sev:"ai",problema:String(x.problema),explic:String(x.explicacao||""),sug:String(x.sugestao||""),scene:s?s.el.id:null,char:c?c.id:null,pedido:x.pedido_correcao?String(x.pedido_correcao):"",cueSug:x.cue_sugerido&&typeof x.cue_sugerido==="object"&&x.cue_sugerido.cena!=null?x.cue_sugerido:null}; });
  }catch(e){ if(!(e&&e.code==="cancelled")) S.an[p.id].err=e&&e.code==="not_granted"?"A IA não foi liberada nesta página. As verificações automáticas continuam valendo.":"A IA não respondeu agora. As verificações automáticas continuam valendo."; }
  S.an[p.id].loading=false; draw();
}

function guideSteps(p){

    {q:"Qual é a ideia?",h:"Em uma frase: o que você quer contar?",f:"dev.ideia",v:p.dev.ideia,done:!!p.dev.ideia.trim(),tab:"historia"},
    {q:"Qual é a mensagem?",h:"O que o público deve levar para casa?",f:"tema",v:p.tema,done:!!p.tema.trim(),tab:"historia"},
    {q:"Para quem é a peça?",h:"Ex.: crianças de 6 a 10 anos, toda a igreja.",f:"publico",v:p.publico,done:!!p.publico.trim(),tab:"historia"},
    {q:"Quem são os personagens?",h:"Comece pelo protagonista. Pode ajustar depois.",done:p.personagens.length>0,tab:"personagens",go:"Abrir personagens"},
    {q:"Qual é o conflito?",h:"O que atrapalha o protagonista?",f:"dev.conflito",v:p.dev.conflito,done:!!p.dev.conflito.trim(),tab:"historia"},
    {q:"Quais são as cenas?",h:"Crie um cartão para cada parte da história.",done:sc.length>0,tab:"cenas",go:"Abrir quadro de cenas"},
    {q:"Escreva a primeira cena.",h:"Escreva o nome de quem fala, Enter, e a fala. Só isso.",done:infos.length>0&&infos[0].written,tab:"roteiro",go:"Escrever a cena 1"},
    {q:"Continue as outras cenas.",h:"Uma de cada vez. O quadro mostra quais faltam.",done:infos.length>0&&infos.every(i=>i.written),tab:"roteiro",go:"Continuar escrevendo"},
    {q:"Revise o texto e a duração.",h:"Leia em voz alta e confira se cabe no tempo.",done:!!p.revisado,tab:"cenas",go:"Ver duração das cenas",mark:true},
    {q:"Prepare para o ensaio.",h:"Defina quem interpreta cada personagem.",done:p.personagens.length>0&&p.personagens.every(c=>c.ator.trim()),tab:"producao",go:"Definir elenco"}

function guideHTML(p){

  return `<div class="guide"><div class="guide-top"><span class="eyebrow">Passo ${i+1} de 10</span>${dots}</div><b>${s.q}</b>${body}

const lines=t=>String(t||"").split("\n").map(x=>x.trim()).filter(Boolean);
function propsIndex(p){
  const idx={}; named(p).forEach(s=>lines(s.el.objetos).forEach(o=>{ const k=norm(o); (idx[k]=idx[k]||{nome:o,cenas:[]}).cenas.push(s.n); }));
  p.personagens.forEach(c=>lines(String(c.objetos).replace(/,/g,"\n")).forEach(o=>{ const k=norm(o); idx[k]=idx[k]||{nome:o,cenas:[]}; idx[k].quem=(idx[k].quem||[]).concat(c.nome); }));
  lines(p.producao.objetos).forEach(o=>{ const k=norm(o); idx[k]=idx[k]||{nome:o,cenas:[]}; idx[k].geral=true; });
  return Object.values(idx);
}

function needs(p){
  const sc=named(p);
  const cenasTxt=a=>a.length?(a.length>1?"cenas ":"cena ")+a.join(", "):"";
  const objetos=propsIndex(p).map(o=>({key:"obj:"+norm(o.nome),nome:o.nome,det:cenasTxt(o.cenas)||(o.geral?"uso geral":"sem cena definida"),extra:o.quem?"usa: "+o.quem.join(", "):""}));
  const figurinos=p.personagens.filter(c=>charScenes(p,c).length||c.figurino.trim()).map(c=>({key:"fig:"+c.id,nome:c.nome+(c.figurino.trim()?": "+c.figurino:""),det:cenasTxt(charScenes(p,c).map(x=>x.s.n))||"não aparece em cena",extra:c.ator.trim()?"com "+c.ator:"sem ator",missing:c.figurino.trim()?"":"Figurino não definido"}));
  const cenario=[...(p.producao.cenario.trim()?[{key:"cen:geral",nome:p.producao.cenario,det:"toda a peça"}]:[]),...sc.filter(s=>s.el.cenario.trim()).map(s=>({key:"cen:"+s.el.id,nome:s.el.cenario,det:"cena "+s.n}))];
  const sm=new Map(); const addS=(t,n)=>{ const k=norm(t); if(!k) return; if(!sm.has(k)) sm.set(k,{nome:t.trim(),cenas:[]}); if(n&&!sm.get(k).cenas.includes(n)) sm.get(k).cenas.push(n); };
  sc.forEach(s=>{ sceneInfo(p,s).els.forEach(e=>{ if(e.t==="musica") addS(e.x,s.n); }); lines(s.el.som).forEach(x=>addS(x,s.n)); }); lines(p.producao.som).forEach(x=>addS(x,0));
  const sons=[...sm.values()].map(o=>({key:"som:"+norm(o.nome),nome:o.nome,det:cenasTxt(o.cenas)||"geral"}));
  return [{t:"Objetos",tab:"objetos",items:objetos,empty:"Nenhum objeto anotado. Anote na aba Objetos ou na ficha da cena."},

function techRows(p){ const out=[], snd=soundList(p);
  named(p).forEach(s=>{ const ev=[]; let last=s.start-.5;
    p.lighting.cues.filter(c=>c.sceneId===s.el.id).forEach(c=>{ const ln=cueLinkEl(p,c); const pos=ln?ln.idx:last+.001; last=pos; ev.push({pos,L:{c,code:cueCode(p,c)},m:c.momento||(ln?lineSnippet(p,ln.idx):"")}); });
    snd.filter(x=>x.s.el===s.el).forEach(x=>ev.push({pos:x.idx,S:x.code,m:"Música: "+x.e.x}));
    ev.sort((a,b)=>a.pos-b.pos);
    const rows=[]; ev.forEach(v=>{ const pr=rows[rows.length-1]; if(pr&&Math.abs(pr.pos-v.pos)<1e-9){ if(v.L) pr.luz.push(v.L); if(v.S) pr.som.push(v.S); if(pr.momento==="—"&&v.m) pr.momento=v.m; } else rows.push({pos:v.pos,s,momento:v.m||"—",luz:v.L?[v.L]:[],som:v.S?[v.S]:[]}); });
    if(!rows.length) rows.push({s,momento:"Início da cena",luz:[],som:[]});
    rows[0].first=true; out.push(...rows); });
  return out; }

  ${soundList(p).length?`<p class="note" style="margin:0">${soundList(p).map(x=>`${x.code}: ${esc(x.e.x)}`).join(" · ")}</p>`:""}`; }

/* ---------- análise da iluminação (sem IA) ---------- */
const lsig=(p,c)=>{ const e=effCue(p,c); return [e.st?e.st.id:"",e.alvos.slice().sort().join(","),norm(e.cor),e.int,norm(c.desc)].join("|"); };
function lightIssues(p){ const out=[], L=p.lighting, sc=named(p), cl=cueList(p); const add=o=>out.push({sev:"info",...o});
  if(!L.cues.length&&!L.fixtures.length){ if(sc.some(s=>sceneInfo(p,s).written)) add({id:"lz0",problema:"A iluminação ainda não foi planejada",explic:"Nenhuma cena tem cue de luz.",sug:"Comece com o modelo simples e um cue de entrada por cena.",fix:"luz",fixL:"Planejar iluminação"}); return out; }
  const sem=sc.filter(s=>!L.cues.some(c=>c.sceneId===s.el.id));
  if(sem.length) add({sev:"warn",id:"lzsem",problema:sem.length===1?`A cena ${sem[0].n} não tem iluminação definida`:`${sem.length} cenas sem iluminação definida`,explic:`Cenas: ${sem.map(s=>s.n).join(", ")}.`,sug:"Crie pelo menos um cue de entrada para cada cena.",scene:sem[0].el.id,fix:"cueadd",fixL:"Adicionar cue"});
  const last=sc[sc.length-1]; if(last&&sem.includes(last)&&sem.length>1) add({sev:"warn",id:"lzfim",problema:"O final da peça não tem cue de luz",explic:`A cena ${last.n} é a última e não tem luz definida.`,sug:"Um final costuma pedir uma mudança de luz marcante.",scene:last.el.id,fix:"cueadd",fixL:"Adicionar cue no final"});
  const semM=cl.filter(x=>x.s&&!String(x.c.momento).trim()&&!cueLinkEl(p,x.c)); if(semM.length) add({id:"lzmom",problema:pl(semM.length,"cue sem momento definido","cues sem momento definido"),explic:semM.map(x=>x.code).join(", ")+". Quem opera não saberá quando agir.",sug:"Diga quando acontece: “quando João entra”, “início da cena”…",cue:semM[0].c.id,fix:"cue",fixL:"Completar "+semM[0].code});
  const orf=cl.filter(x=>!x.s); if(orf.length) add({sev:"warn",id:"lzorf",problema:`${pl(orf.length,"cue aponta","cues apontam")} para cena que não existe mais`,explic:orf.map(x=>x.code).join(", ")+".",sug:"Escolha a cena certa ou exclua o cue.",cue:orf[0].c.id,fix:"cue",fixL:"Corrigir "+orf[0].code});
  const used=new Set(L.cues.flatMap(c=>effCue(p,c).alvos)); const inc=L.fixtures.filter(f=>used.has(f.id)&&(!f.tipo||!f.pos));
  if(inc.length) add({id:"lzfix",problema:`${pl(inc.length,"equipamento usado está","equipamentos usados estão")} com cadastro incompleto`,explic:inc.map(fixLabel).join(", ")+": falta tipo ou posição.",sug:"Complete para o mapa e a ficha técnica ficarem certos.",fix:"fixc",fixId:inc[0].id,fixL:"Completar cadastro"});
  for(let i=1;i<sc.length;i++){ const a=L.cues.find(c=>c.sceneId===sc[i-1].el.id), b=L.cues.find(c=>c.sceneId===sc[i].el.id); if(a&&b&&lsig(p,a)===lsig(p,b)&&cueAcao(p,a)){ add({id:"lzsim"+i,problema:`As cenas ${sc[i-1].n} e ${sc[i].n} começam com a mesma luz`,explic:"O público pode não perceber a troca de cena.",sug:`Mude a cor, a intensidade ou a área na entrada da cena ${sc[i].n}.`,scene:sc[i].el.id,cue:b.id,fix:"cue",fixL:"Ajustar "+cueCode(p,b)}); break; } }
  return out; }

function docsSummary(p){

  const cs=o.cenaSel&&sc.find(s=>s.el.id===o.cenaSel), cena=cs?`cena ${cs.n}`:"todas as cenas";
  const sel=DOCS.filter(([k])=>D[k]).map(([k])=>nm(k)+({porCena:` (${cena})`,falas:` (${pers})`,personagem:` (${pers})`,ficha:` (${ator})`}[k]||""));
  const warn=[], hasText=p.els.some(e=>e.t!=="cena"&&e.x.trim()), cues=p.lighting.cues.length;

  if((D.falas||D.personagem||D.ficha)&&!p.personagens.length) warn.push("Ainda não há personagens. As folhas de falas e fichas sairão vazias.");
  if((D.operador||D.luz)&&!cues) warn.push("Ainda não há mudanças de luz anotadas. A ficha de luz sairá sem cues.");

async function runAI(prompt, renderFn, long, target){

let DRAG=null;
function dragStart(ev,id){
  const card=ev.target.closest(".scard"); if(!card) return;
  ev.preventDefault();
  const r=card.getBoundingClientRect();
  const ghost=card.cloneNode(true); ghost.classList.add("drag-ghost"); ghost.style.width=r.width+"px"; document.body.appendChild(ghost);
  card.classList.add("dragging");
  DRAG={id,card,ghost,target:null,after:false,dx:ev.clientX-r.left,dy:ev.clientY-r.top,moved:false,x0:ev.clientX,y0:ev.clientY};
  dragMove(ev);
}
function dragMove(ev){
  if(!DRAG) return;
  if(Math.hypot(ev.clientX-DRAG.x0,ev.clientY-DRAG.y0)>4) DRAG.moved=true;
  DRAG.ghost.style.left=(ev.clientX-DRAG.dx)+"px"; DRAG.ghost.style.top=(ev.clientY-DRAG.dy)+"px";
  $$(".scard").forEach(c=>c.classList.remove("drop-b","drop-a"));
  let best=null,bd=1e9; $$(".scard").forEach(c=>{ if(c===DRAG.card||c.classList.contains("drag-ghost")) return; const r=c.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2; const d=Math.hypot(ev.clientX-cx,(ev.clientY-cy)*1.4); if(d<bd){bd=d;best=c;} });
  if(best&&DRAG.moved){ const r=best.getBoundingClientRect(); const single=window.innerWidth<=640; const after=single? ev.clientY>r.top+r.height/2 : ev.clientX>r.left+r.width/2; best.classList.add(after?"drop-a":"drop-b"); DRAG.target=best.dataset.sid; DRAG.after=after; }
  if(ev.clientY<90) window.scrollBy(0,-14); else if(ev.clientY>window.innerHeight-90) window.scrollBy(0,14);
}
function dragEnd(){
  if(!DRAG) return; const d=DRAG; DRAG=null; d.ghost.remove(); d.card.classList.remove("dragging"); $$(".scard").forEach(c=>c.classList.remove("drop-b","drop-a"));
  if(!d.moved||!d.target||d.target===d.id) return;
  const p=cur(); const sc=named(p); const from=sc.findIndex(s=>s.el.id===d.id); let to=sc.findIndex(s=>s.el.id===d.target); if(from<0||to<0) return;
  pushUndo(p);
  if(p.usaAtos) sc[from].el.ato=sc[to].el.ato;
  if(d.after) to++; if(from<to) to--;
  moveScene(p,from,to); normalizeActs(p); touch(p); renderMain();
  const nn=named(p).findIndex(s=>s.el.id===d.id)+1; toast(`Agora é a cena ${nn}. O roteiro foi reorganizado.`,true);
}
document.addEventListener("pointermove",e=>{ if(DRAG) dragMove(e); });
